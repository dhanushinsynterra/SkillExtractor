# Nginx site config for a host install with TLS (e.g. Let's Encrypt).
#   1. Build the web app:            npm run build   → copy web/dist to /usr/share/nginx/html
#   2. Copy snippets:                deploy/nginx/{security-headers,proxy,synterra.common}.conf
#                                    → /etc/nginx/snippets/synterra-{security-headers,proxy}.conf
#                                    → /etc/nginx/snippets/synterra.common.conf
#   3. Run the server on :8787:      npm start   (systemd, pm2, …)
#   4. Replace interview.example.com and the certificate paths below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=synterra_sessions:10m rate=10r/m;

upstream synterra_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name interview.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name interview.example.com;

    ssl_certificate     /etc/letsencrypt/live/interview.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interview.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/synterra.common.conf;
}
