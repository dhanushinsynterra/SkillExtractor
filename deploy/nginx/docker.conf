# Nginx config used by docker-compose: plain HTTP on :80, app at app:8787.
# Browsers only allow camera/microphone on HTTPS (or localhost), so put a TLS
# terminator in front, or use synterra.conf on a host with certificates.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=synterra_sessions:10m rate=10r/m;

upstream synterra_app {
    server app:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    include /etc/nginx/snippets/synterra.common.conf;
}
