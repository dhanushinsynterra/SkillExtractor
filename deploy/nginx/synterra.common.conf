# Shared server-level config for Synterra. Expects an upstream named
# "synterra_app" and the $connection_upgrade map (see synterra.conf).

root /usr/share/nginx/html;
index index.html;

client_max_body_size 1m;
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

include /etc/nginx/snippets/synterra-security-headers.conf;

# Live interview audio/events. Long-lived, unbuffered, upgraded connection.
location /ws/ {
    proxy_pass http://synterra_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Creating interview sessions: rate limited per client IP.
location = /api/sessions {
    limit_req zone=synterra_sessions burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://synterra_app;
    include /etc/nginx/snippets/synterra-proxy.conf;
}

location /api/ {
    proxy_pass http://synterra_app;
    include /etc/nginx/snippets/synterra-proxy.conf;
}

# Fingerprinted build assets: cache forever.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/synterra-security-headers.conf;
    try_files $uri =404;
}

# The app shell must always be revalidated so new deploys take effect.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/synterra-security-headers.conf;
}

location / {
    try_files $uri /index.html;
}
