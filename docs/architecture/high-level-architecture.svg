<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 860" width="1420" height="860">
<style>
 text{font-family:'Segoe UI',Inter,Arial,sans-serif;fill:#1f2937;white-space:pre}
 .t{font-size:26px;font-weight:700}
 .st{font-size:14px;fill:#6b7280}
 .zl{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#6b7280}
 .bt{font-size:14px;font-weight:700}
 .bl{font-size:12px;fill:#374151}
 .mono{font-family:Consolas,'Cascadia Mono',monospace;font-size:11.5px;fill:#374151}
 .al{font-size:11.5px;fill:#111827;font-weight:600}
 .num{font-size:13px;font-weight:700;fill:#fff}
</style><defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
</defs><rect width="1420" height="860" fill="#ffffff"/><text class="t" x="40" y="48">Synterra — High-Level Architecture</text><text class="st" x="40" y="72">AI voice interviewer: browser ⇄ Nginx ⇄ Node.js bridge ⇄ Google Gemini. No database; sessions are JSON files.</text><rect x="30" y="95" width="300" height="575" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 5"/><text class="zl" x="44" y="117">BROWSERS (REACT SPA)</text><rect x="380" y="95" width="220" height="575" rx="14" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 5"/><text class="zl" x="394" y="117">EDGE</text><rect x="650" y="95" width="390" height="575" rx="14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 5"/><text class="zl" x="664" y="117">NODE.JS SERVER · DOCKER :8787</text><rect x="1090" y="95" width="300" height="575" rx="14" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 5"/><text class="zl" x="1104" y="117">EXTERNAL SERVICES &amp; STORAGE</text><rect x="50" y="130" width="260" height="270" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><rect x="50" y="130" width="6" height="270" rx="3" fill="#3b82f6"/><text class="bt" x="66" y="152">Candidate app</text><text class="bl" x="66" y="172">Start → Check → Session → Done</text><text class="bl" x="66" y="189"></text><text class="bl" x="66" y="206">Mic → AudioWorklet → 16 kHz PCM16</text><text class="bl" x="66" y="223">VoiceGate: noise gate, echo,</text><text class="bl" x="66" y="240">   barge-in detection</text><text class="bl" x="66" y="257">Player: gapless 24 kHz playback</text><text class="bl" x="66" y="274">Proctor: MediaPipe face detection</text><text class="bl" x="66" y="291">Tab-visibility monitor</text><text class="bl" x="66" y="308">Code card + help buttons</text><text class="bl" x="66" y="325">(Repeat / Simpler / Need a moment)</text><text class="bl" x="66" y="342">Token kept in sessionStorage</text><rect x="50" y="440" width="260" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><rect x="50" y="440" width="6" height="200" rx="3" fill="#3b82f6"/><text class="bt" x="66" y="462">Admin console</text><text class="bl" x="66" y="482">Login gate (admin password)</text><text class="bl" x="66" y="499">Dashboard: sessions, KPIs (poll 5s)</text><text class="bl" x="66" y="516">Report: Manager · HR · Tech ·</text><text class="bl" x="66" y="533">   Transcript tabs, skills radar</text><text class="bl" x="66" y="550">Settings: Gemini key, models,</text><text class="bl" x="66" y="567">   voice</text><text class="bl" x="66" y="584">Sends x-admin-key header</text><rect x="400" y="130" width="180" height="510" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><rect x="400" y="130" width="6" height="510" rx="3" fill="#8b5cf6"/><text class="bt" x="416" y="152">Nginx 1.27</text><text class="bl" x="416" y="172">TLS 1.2/1.3 + HSTS</text><text class="bl" x="416" y="189">CSP, X-Frame-Options DENY</text><text class="bl" x="416" y="206">Permissions-Policy:</text><text class="bl" x="416" y="223">   camera/mic self only</text><text class="bl" x="416" y="240"></text><text class="bl" x="416" y="257">limit_req 10 r/min</text><text class="bl" x="416" y="274">   on POST /api/sessions</text><text class="bl" x="416" y="291">body ≤ 1 MB</text><text class="bl" x="416" y="308"></text><text class="bl" x="416" y="325">Serves built SPA</text><text class="bl" x="416" y="342">   (web/dist, 1y assets)</text><text class="bl" x="416" y="359"></text><text class="bl" x="416" y="376">/api/  → proxy :8787</text><text class="bl" x="416" y="393">/ws/   → WS upgrade,</text><text class="bl" x="416" y="410">   unbuffered, 1 h timeout</text><rect x="670" y="130" width="350" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><rect x="670" y="130" width="6" height="110" rx="3" fill="#10b981"/><text class="bt" x="686" y="152">REST API  (index.ts · Express 5)</text><text class="bl" x="686" y="172">POST /api/sessions → {id, token}</text><text class="bl" x="686" y="189">GET  /api/sessions/:id/feedback</text><text class="bl" x="686" y="206">/api/admin/*  (requireAdmin, rate limit)</text><rect x="670" y="260" width="350" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><rect x="670" y="260" width="6" height="140" rx="3" fill="#10b981"/><text class="bt" x="686" y="282">LiveInterview bridge  (live.ts · ws)</text><text class="bl" x="686" y="302">WS /ws/sessions/:id?token=…</text><text class="bl" x="686" y="319">Relays audio + transcripts both ways</text><text class="bl" x="686" y="336">Runs Gemini tool calls: set_phase,</text><text class="bl" x="686" y="353">   record_skill, show_code_card,</text><text class="bl" x="686" y="370">   apply_code_edit, end_interview</text><text class="bl" x="686" y="387">Leak guard · proctor notices · 90 s resume</text><rect x="670" y="425" width="350" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><rect x="670" y="425" width="6" height="70" rx="3" fill="#10b981"/><text class="bt" x="686" y="447">Report generator  (report.ts)</text><text class="bl" x="686" y="467">transcript + skill evidence → JSON report</text><rect x="670" y="510" width="350" height="50" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><rect x="670" y="510" width="6" height="50" rx="3" fill="#10b981"/><text class="bt" x="686" y="532">Settings &amp; model auto-select  (settings.ts)</text><rect x="670" y="575" width="350" height="75" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><rect x="670" y="575" width="6" height="75" rx="3" fill="#10b981"/><text class="bt" x="686" y="597">Session store  (store.ts)</text><text class="bl" x="686" y="617">in-memory Map · atomic JSON writes</text><text class="bl" x="686" y="634">sha256-hashed session tokens</text><rect x="1110" y="225" width="260" height="150" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/><rect x="1110" y="225" width="6" height="150" rx="3" fill="#f97316"/><text class="bt" x="1126" y="247">Gemini Live API</text><text class="bl" x="1126" y="267">native-audio model</text><text class="bl" x="1126" y="284">speech-to-text + LLM +</text><text class="bl" x="1126" y="301">   text-to-speech in one stream</text><text class="bl" x="1126" y="318">function calling (tools)</text><text class="bl" x="1126" y="335">in 16 kHz / out 24 kHz PCM</text><rect x="1110" y="415" width="260" height="90" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/><rect x="1110" y="415" width="6" height="90" rx="3" fill="#f97316"/><text class="bt" x="1126" y="437">Gemini text model</text><text class="bl" x="1126" y="457">gemini-2.5-flash (default)</text><text class="bl" x="1126" y="474">responseSchema → JSON report</text><rect x="1110" y="560" width="260" height="90" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/><rect x="1110" y="560" width="6" height="90" rx="3" fill="#ca8a04"/><text class="bt" x="1126" y="582">DATA_DIR volume</text><text class="bl" x="1126" y="602">sessions/&lt;uuid&gt;.json</text><text class="bl" x="1126" y="619">settings.json  (mode 0600)</text><polyline points="310,205 400,205" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text class="al" x="355" y="197" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">HTTPS</text><polyline points="310,300 400,300" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)" marker-start="url(#ao)"/><text class="al" x="355" y="292" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">WSS audio</text><polyline points="310,300 400,300" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><text class="al" x="355" y="318" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">JSON</text><polyline points="310,540 400,540" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text class="al" x="355" y="532" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">HTTPS</text><polyline points="580,185 670,185" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><text class="al" x="625" y="177" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">/api/</text><polyline points="580,330 670,330" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/><text class="al" x="625" y="322" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">/ws/</text><polyline points="1020,290 1110,290" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/><text class="al" x="1065" y="282" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">mic PCM</text><polyline points="1110,335 1020,335" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/><text class="al" x="1065" y="356" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">voice, text,</text><polyline points="1110,335 1020,335" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ao)"/><text class="al" x="1065" y="370" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">tool calls</text><polyline points="1020,460 1110,460" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><text class="al" x="1065" y="452" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">generate</text><polyline points="1020,612 1110,612" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><text class="al" x="1065" y="604" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">read/write</text><polyline points="845,400 845,425" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><text class="al" x="855" y="416" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4">on finish()</text><polyline points="1020,535 1060,535 1060,490 1110,490" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><text class="al" x="1066" y="528" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4">models.list</text><text class="zl" x="44" y="712">END-TO-END FLOW</text><rect x="40" y="730" width="200" height="105" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><rect x="40" y="730" width="6" height="105" rx="3" fill="#9ca3af"/><text class="bt" x="82" y="752">Admin setup</text><text class="bl" x="56" y="772">Enters Gemini key;</text><text class="bl" x="56" y="789">server verifies it and</text><text class="bl" x="56" y="806">picks live + report models</text><circle cx="62" cy="748" r="11" fill="#4b5563"/><text class="num" x="62" y="753" text-anchor="middle">1</text><polyline points="244,782 270,782" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><rect x="274" y="730" width="200" height="105" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><rect x="274" y="730" width="6" height="105" rx="3" fill="#9ca3af"/><text class="bt" x="316" y="752">Register</text><text class="bl" x="290" y="772">Candidate fills name,</text><text class="bl" x="290" y="789">email, track, consent →</text><text class="bl" x="290" y="806">gets session id + token</text><circle cx="296" cy="748" r="11" fill="#4b5563"/><text class="num" x="296" y="753" text-anchor="middle">2</text><polyline points="478,782 504,782" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><rect x="508" y="730" width="200" height="105" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><rect x="508" y="730" width="6" height="105" rx="3" fill="#9ca3af"/><text class="bt" x="550" y="752">Device check</text><text class="bl" x="524" y="772">Mic calibration, camera</text><text class="bl" x="524" y="789">face check, speaker</text><text class="bl" x="524" y="806">chime, network ping</text><circle cx="530" cy="748" r="11" fill="#4b5563"/><text class="num" x="530" y="753" text-anchor="middle">3</text><polyline points="712,782 738,782" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><rect x="742" y="730" width="200" height="105" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><rect x="742" y="730" width="6" height="105" rx="3" fill="#9ca3af"/><text class="bt" x="784" y="752">Live interview</text><text class="bl" x="758" y="772">Aria asks questions;</text><text class="bl" x="758" y="789">skills recorded via tools;</text><text class="bl" x="758" y="806">code card bug fix</text><circle cx="764" cy="748" r="11" fill="#4b5563"/><text class="num" x="764" y="753" text-anchor="middle">4</text><polyline points="946,782 972,782" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><rect x="976" y="730" width="200" height="105" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><rect x="976" y="730" width="6" height="105" rx="3" fill="#9ca3af"/><text class="bt" x="1018" y="752">Report</text><text class="bl" x="992" y="772">Gemini writes verdict,</text><text class="bl" x="992" y="789">score, skills, strengths</text><text class="bl" x="992" y="806">from transcript + evidence</text><circle cx="998" cy="748" r="11" fill="#4b5563"/><text class="num" x="998" y="753" text-anchor="middle">5</text><polyline points="1180,782 1206,782" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/><rect x="1210" y="730" width="200" height="105" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><rect x="1210" y="730" width="6" height="105" rx="3" fill="#9ca3af"/><text class="bt" x="1252" y="752">Review</text><text class="bl" x="1226" y="772">Candidate sees feedback;</text><text class="bl" x="1226" y="789">admin reads report tabs,</text><text class="bl" x="1226" y="806">regenerates or deletes</text><circle cx="1232" cy="748" r="11" fill="#4b5563"/><text class="num" x="1232" y="753" text-anchor="middle">6</text></svg>